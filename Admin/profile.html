<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Profile - Job Portal Management System</title>
    <link rel="stylesheet" href="admin.css">
</head>

<body>
    <div class="navbar">
        <p><a href="dashboard.html">Dashboard</a></p>
        <p><a href="users.html">Manage Users</a></p>
        <p><a href="jobs.html">Manage Jobs</a></p>
        <p><a href="applications.html">Applications</a></p>
        <p><a href="employer-verification.html">Employer Verification</a></p>
        <p><a href="categories.html">Categories</a></p>

        <p><a href="suspicious-jobs.html">Suspicious Jobs</a></p>

        <p><a href="profile.html">Update Profile</a></p>
        <p><a href="logout.html">Logout</a></p>
    </div>

    <div class="container">
        <h1>Admin Profile</h1>
        <section id="profile">
            
            <form method="post" action="">
                <fieldset>
                    <legend>Admin Profile Information</legend>
                    <table>
                        <tr>
                            <td><label for="name">Full Name:</label></td>
                            <td><input type="text" id="name" name="name" required></td>
                        </tr>
                        <tr>
                            <td><label for="email">Email:</label></td>
                            <td><input type="email" id="email" name="email" required></td>
                        </tr>
                        <tr>
                            <td><label for="phone">Phone:</label></td>
                            <td><input type="tel" id="phone" name="phone" required></td>
                        </tr>
                        <tr>
                            <td><label for="password">New Password:</label></td>
                            <td><input type="password" id="password" name="password"></td>
                        </tr>
                        <tr>
                            <td><label for="confirmPassword">Confirm New Password:</label></td>
                            <td><input type="password" id="confirmPassword" name="confirmPassword"></td>
                        </tr>
                    </table>
                    <input type="submit" id="updateProfile" name="updateProfile" value="Update Profile">
                    <input type="reset" value="Reset">
                </fieldset>
            </form>
        </section>
    </div>

    <script src="admin.js"></script>
</body>

</html>
