<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Employer company profile, contact details, and password settings">
    <title>Employer Profile | JobPortal</title>
    <link rel="stylesheet" href="Employer.css">
</head>

<body>

    <div class="container">
        <h1>Employer Portal - Profile</h1>

        <div class="navbar">
            <div class="nav-links">
                <p><a href="Employer-Dashboard.html">Dashboard</a></p>
                <p><a href="Employer-Management.html">Management</a></p>
                <p><a href="Employer-Profile.html" class="active">Profile</a></p>
            </div>
            <div class="nav-logout">
                <p><a href="login.html">LogOut</a></p>
            </div>
        </div>

        <div id="profileMessage" class="message"></div>

        <section>
            <h2>Company &amp; Contact Information</h2>
            <fieldset>
                <legend>Employer Profile</legend>
                <form id="profileForm" onsubmit="return saveProfile()">
                    <table>
                        <tr>
                            <td><label for="companyName">Company Name:</label></td>
                            <td>
                                <input type="text" id="companyName">
                                <span class="error" id="companyNameError"></span>
                            </td>
                        </tr>
                        <tr>
                            <td><label for="industry">Industry:</label></td>
                            <td>
                                <input type="text" id="industry">
                                <span class="error" id="industryError"></span>
                            </td>
                        </tr>
                        <tr>
                            <td><label for="companySize">Company Size:</label></td>
                            <td>
                                <select id="companySize">
                                    <option value="1-50">1-50</option>
                                    <option value="51-200">51-200</option>
                                    <option value="201-500">201-500</option>
                                    <option value="500+">500+</option>
                                </select>
                                <span class="error" id="companySizeError"></span>
                            </td>
                        </tr>
                        <tr>
                            <td><label for="website">Website:</label></td>
                            <td>
                                <input type="text" id="website">
                                <span class="error" id="websiteError"></span>
                            </td>
                        </tr>
                        <tr>
                            <td><label for="contactName">Primary Contact:</label></td>
                            <td>
                                <input type="text" id="contactName">
                                <span class="error" id="contactNameError"></span>
                            </td>
                        </tr>
                        <tr>
                            <td><label for="email">Email:</label></td>
                            <td>
                                <input type="email" id="email">
                                <span class="error" id="emailError"></span>
                            </td>
                        </tr>
                        <tr>
                            <td><label for="phone">Phone:</label></td>
                            <td>
                                <input type="tel" id="phone">
                                <span class="error" id="phoneError"></span>
                            </td>
                        </tr>
                        <tr>
                            <td><label for="city">City:</label></td>
                            <td>
                                <input type="text" id="city">
                                <span class="error" id="cityError"></span>
                            </td>
                        </tr>
                        <tr>
                            <td><label for="address">Address:</label></td>
                            <td>
                                <input type="text" id="address">
                                <span class="error" id="addressError"></span>
                            </td>
                        </tr>
                        <tr>
                            <td><label for="about">About Company:</label></td>
                            <td>
                                <textarea id="about"></textarea>
                                <span class="error" id="aboutError"></span>
                            </td>
                        </tr>
                    </table>
                    <input type="submit" value="Save Profile">
                    <button type="button" class="secondary-btn" onclick="resetProfileToDefault()">Reset Default</button>
                </form>
            </fieldset>
        </section>

        <section>
            <h2>Account Security</h2>
            <fieldset>
                <legend>Update Password</legend>
                <form id="passwordForm" onsubmit="return updatePassword()">
                    <table>
                        <tr>
                            <td><label for="currentPassword">Current Password:</label></td>
                            <td>
                                <input type="password" id="currentPassword">
                                <span class="error" id="currentPasswordError"></span>
                            </td>
                        </tr>
                        <tr>
                            <td><label for="newPassword">New Password:</label></td>
                            <td>
                                <input type="password" id="newPassword">
                                <span class="error" id="newPasswordError"></span>
                            </td>
                        </tr>
                        <tr>
                            <td><label for="confirmPassword">Confirm Password:</label></td>
                            <td>
                                <input type="password" id="confirmPassword">
                                <span class="error" id="confirmPasswordError"></span>
                            </td>
                        </tr>
                    </table>
                    <input type="submit" value="Update Password">
                </form>
            </fieldset>
        </section>

        <footer class="portal-footer">
            <p>&copy; 2026 JobPortal &middot; Employer Portal</p>
        </footer>
    </div>

    <script src="Employer-Data.js"></script>
    <script src="Employer-Profile.js"></script>
</body>

</html>
