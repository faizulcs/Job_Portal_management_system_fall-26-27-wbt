<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Employer profile page for updating company details, security, and preferences">
    <title>Employer Profile | JobPortal</title>
    <link rel="stylesheet" href="employer.css">
</head>

<body>

    <div class="container">
        <h1>Employer Portal - Profile</h1>

        <div class="navbar">
            <p><a href="Employer-Dashboard.html">Dashboard</a></p>
            <p><a href="Employer-Management.html">Management</a></p>
            <p><a href="Employer-Profile.html">Profile</a></p>
        </div>

        <section>
            <h2>Company Profile</h2>
            <fieldset>
                <legend>Company Information</legend>
                <form method="POST" action="#">
                    <table>
                        <tr>
                            <td><label for="companyName">Company Name:</label></td>
                            <td><input type="text" id="companyName" name="companyName" placeholder="Company name"></td>
                        </tr>
                        <tr>
                            <td><label for="email">Company Email:</label></td>
                            <td><input type="email" id="email" name="email" placeholder="Email address"></td>
                        </tr>
                        <tr>
                            <td><label for="phone">Phone:</label></td>
                            <td><input type="tel" id="phone" name="phone" placeholder="Phone number"></td>
                        </tr>
                        <tr>
                            <td><label for="website">Website:</label></td>
                            <td><input type="text" id="website" name="website" placeholder="Website URL"></td>
                        </tr>
                        <tr>
                            <td><label for="industry">Industry:</label></td>
                            <td><input type="text" id="industry" name="industry" placeholder="Industry"></td>
                        </tr>
                        <tr>
                            <td><label for="description">Company Description:</label></td>
                            <td><textarea id="description" name="description"
                                    placeholder="Company description"></textarea></td>
                        </tr>
                    </table>
                    <input type="submit" name="update" value="Update Profile">
                </form>
            </fieldset>
        </section>

        <section>
            <h2>Account Security</h2>
            <fieldset>
                <legend>Change Password</legend>
                <form method="POST" action="#">
                    <table>
                        <tr>
                            <td><label for="currentPassword">Current Password:</label></td>
                            <td><input type="password" id="currentPassword" name="currentPassword"
                                    placeholder="Enter current password"></td>
                        </tr>
                        <tr>
                            <td><label for="newPassword">New Password:</label></td>
                            <td><input type="password" id="newPassword" name="newPassword"
                                    placeholder="Enter new password"></td>
                        </tr>
                        <tr>
                            <td><label for="confirmPassword">Confirm Password:</label></td>
                            <td><input type="password" id="confirmPassword" name="confirmPassword"
                                    placeholder="Confirm new password"></td>
                        </tr>
                    </table>
                    <input type="submit" value="Update Password">
                </form>
            </fieldset>
        </section>

        <section>
            <h2>Contact Preferences</h2>
            <fieldset>
                <legend>Notification Settings</legend>
                <form method="POST" action="#">
                    <table>
                        <tr>
                            <td><label for="emailAlerts">Email Alerts:</label></td>
                            <td><input type="text" id="emailAlerts" value="Enabled"></td>
                        </tr>
                        <tr>
                            <td><label for="smsAlerts">SMS Notifications:</label></td>
                            <td><input type="text" id="smsAlerts" value="Disabled"></td>
                        </tr>
                    </table>
                    <input type="submit" value="Save Preferences">
                </form>
            </fieldset>
        </section>
    </div>

</body>

</html>
