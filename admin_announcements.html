</head>

<body>
    <div class="navbar">
        <p><a href="admin_dashboard.html">Dashboard</a></p>
        <p><a href="admin_users.html">Manage Users</a></p>
        <p><a href="admin_jobs.html">Manage Jobs</a></p>

    </div>

    <div class="container">
        <h1>Platform-Wide Announcements</h1>
        <section id="announcements">

            <fieldset>
                <legend>Publish Announcement</legend>
                <form method="post" action="">
                    <table>
                        <tr>
                            <td><label for="announcementTitle">Announcement Title:</label></td>
                            <td><input type="text" id="announcementTitle" name="announcementTitle" required>
                                <span id="announcementTitleError" class="error"
                                    style="color:red; display:block;"></span>
                            </td>
                        </tr>
                        <tr>
                            <td><label for="announcementMessage">Message:</label></td>
                            <td><textarea id="announcementMessage" name="announcementMessage" rows="5" cols="35"
                                    required></textarea>
                                <span id="announcementMessageError" class="error"
                                    style="color:red; display:block;"></span>
                            </td>
                        </tr>
                        <tr>
                            <td><label for="announcementAudience">Audience:</label></td>
                            <td>
                                <select id="announcementAudience" name="announcementAudience">
                                    <option value="all">All Users</option>
                                    <option value="job_seekers">Job Seekers</option>
                                    <option value="employers">Employers</option>
                                </select><span id="announcementAudienceError" class="error"
                                    style="color:red; display:block;"></span>
                            </td>
                        </tr>
                        <tr>
                            <td colspan="2"><input type="submit" name="publishAnnouncement"
                                    value="Publish Announcement"></td>
                        </tr>
                    </table>
                </form>
            </fieldset>
        </section>
    </div>

    <script src="admin_js/data.js"></script>
    <script src="admin_js/admin.js"></script>
</body>

</html>
