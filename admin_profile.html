</head>

<body>
    <div class="navbar">
        <p><a href="admin_dashboard.html">Dashboard</a></p>
        <p><a href="admin_users.html">Manage Users</a></p>
        <p><a href="admin_jobs.html">Manage Jobs</a></p>

        <p><a href="admin_logout.html">Logout</a></p>
    </div>

    <div class="container">
        <h1>Admin Profile</h1>
        <section id="profile">

            <form method="post" action="">
                <fieldset>
                    <legend>Admin Profile Information</legend>
                    <table>
                        <tr>
                            <td><label for="name">Full Name:</label></td>
                            <td><input type="text" id="name" name="name" required><span id="nameError" class="error" style="color:red; display:block;"></span></td>
                        </tr>
                        <tr>
                            <td><label for="email">Email:</label></td>
                            <td><input type="email" id="email" name="email" required><span id="emailError" class="error" style="color:red; display:block;"></span></td>
                        </tr>
                        <tr>
                            <td><label for="phone">Phone:</label></td>
                            <td><input type="tel" id="phone" name="phone" required><span id="phoneError" class="error" style="color:red; display:block;"></span></td>
                        </tr>
                        <tr>
                            <td><label for="password">New Password:</label></td>
                            <td><input type="password" id="password" name="password"><span id="passwordError" class="error" style="color:red; display:block;"></span></td>
                        </tr>
                        <tr>
                            <td><label for="confirmPassword">Confirm New Password:</label></td>
                            <td><input type="password" id="confirmPassword" name="confirmPassword"><span id="confirmPasswordError" class="error" style="color:red; display:block;"></span></td>
                        </tr>
                    </table>
                    <input type="submit" id="updateProfile" name="updateProfile" value="Update Profile">
                    <input type="reset" value="Reset">
                </fieldset>
            </form>
        </section>
    </div>

    <script src="admin_js/data.js"></script>
    <script src="admin_js/admin.js"></script>
</body>

</html>
