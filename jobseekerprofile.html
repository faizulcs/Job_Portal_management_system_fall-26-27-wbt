<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Seeker Profile</title>


</head>

<body>

    <div class="navbar">
        <p><a href="seeker-dashboard.html">Dashboard</a></p>
        <p><a href="jobs.html">Find Jobs</a></p>
        <p><a href="applications.html">My Applications</a></p>
        <p><a href="login.html">Logout</a></p>
    </div>

    <div class="container">
        <h1>Job Seeker Profile</h1>

        <form method="post" action="" enctype="multipart/form-data">
            <fieldset>
                <legend>Personal Information</legend>

                <table>
                    <tr>
                        <td><label for="name">Full Name:</label></td>
                        <td><input type="text" id="name" name="name" placeholder="Enter your full name"></td>
                    </tr>

                    <tr>
                        <td><label for="email">Email:</label></td>
                        <td><input type="email" id="email" name="email" placeholder="Enter your email"></td>
                    </tr>

                    <tr>
                        <td><label for="phone">Phone:</label></td>
                        <td><input type="tel" id="phone" name="phone" placeholder="Enter your phone number"></td>
                    </tr>

                    <tr>
                        <td><label for="education">Education:</label></td>
                        <td><textarea id="education" name="education" rows="5"
                                placeholder="Enter your education details"></textarea></td>
                    </tr>

                    <tr>
                        <td><label for="skills">Skills:</label></td>
                        <td><textarea id="skills" name="skills" rows="5" placeholder="Enter your skills"></textarea>
                        </td>
                    </tr>

                    <tr>
                        <td><label for="experience">Experience:</label></td>
                        <td><textarea id="experience" name="experience" rows="5"
                                placeholder="Enter your work experience"></textarea></td>
                    </tr>

                    <tr>
                        <td><label for="cv">Upload CV:</label></td>
                        <td><input type="file" id="cv" name="cv" accept=".pdf,.doc,.docx"></td>
                    </tr>
                </table>

                <input type="submit" id="update" name="update" value="Update Profile">
            </fieldset>
        </form>
    </div>

</body>

</html>
